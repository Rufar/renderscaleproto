buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://maven.cleanroommc.com" }
        maven { url = "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.gtnewhorizons:retrofuturagradle:1.3.16'
        classpath 'com.github.GTNewHorizons:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'java'
apply plugin: 'com.gtnewhorizons.retrofuturagradle'

version = "0.0.1"
group = "ru.example.renderscaleproto"
archivesBaseName = "renderscaleproto"

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    username = 'Developer'

    // Отключаем лишнее для CI
    useDependencyAccessTransformers = false
}

repositories {
    mavenCentral()
    maven { url "https://maven.cleanroommc.com" }
    maven { url "https://repo.spongepowered.org/maven" }
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation 'zone.rong:mixinbooter:7.1'
}

jar {
    manifest {
        attributes(
            'MixinConfigs': 'mixins.renderscaleproto.json'
        )
    }
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Для CI: не запускаем decomp, только сборка
tasks.register('setupCIWorkspace') {
    doLast {
        println "RFG: CI workspace ready (no decomp needed)"
    }
}
