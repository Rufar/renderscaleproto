buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://files.minecraftforge.net/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "0.0.1"
group = "ru.example.renderscaleproto"
archivesBaseName = "renderscaleproto"

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "1.12.2-14.23.5.2859"   // ← вот тут
    runDir = "run"
    mappings = "stable_39"
}

repositories {
    mavenCentral()
    maven { url "https://maven.cleanroommc.com" }
    maven { url "https://repo.spongepowered.org/maven" }
}

dependencies {
    deobfCompile "zone.rong:mixinbooter:7.1"
}

jar {
    manifest {
        attributes('MixinConfigs': 'mixins.renderscaleproto.json')
    }
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
