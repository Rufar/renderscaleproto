plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9' // актуальная стабильная версия для 1.12.2
}

version = "0.0.1"
group = "ru.example.renderscaleproto"
archivesBaseName = "renderscaleproto"

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8)) // мод компилируется под Java 8, как и требуется для 1.12.2
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    username = 'Developer'
    useDependencyAccessTransformers = false
}

repositories {
    mavenCentral()
    maven { name = 'CleanroomMC Maven'; url = 'https://maven.cleanroommc.com' }
    maven { name = 'SpongePowered Maven'; url = 'https://repo.spongepowered.org/maven' }
}

dependencies {
    // MixinBooter обычно нужен как implementation или deobf-зависимость; для 1.12.2 чаще используют compileOnly/implementation
    implementation 'zone.rong:mixinbooter:7.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'MixinConfigs': 'mixins.renderscaleproto.json'
        )
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}
